<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | KabawBaka?</title>
  <link rel="stylesheet" href="style.css">
  <script src="js/main.js"></script>

</head>
<body>
  <div id="navbar"></div>

  <script>
  document.addEventListener('DOMContentLoaded', function() {
    fetch('php/navbar.php')
      .then(response => response.text())
      .then(html => {
        document.getElementById('navbar').innerHTML = html;
        const logout = document.getElementById('logoutBtn');
        if (logout) {
          logout.addEventListener('click', function(e) {
            e.preventDefault();
            fetch('php/logout.php')
              .then(r => r.json())
              .then(data => { if (data.success) window.location.href = 'login.html'; })
              .catch(() => location.reload());
          });
        }
      });
  });
  </script>

  <!-- 🌾 Register Section -->
  <section class="register-section">
    <div class="register-container">
      <h1>Register</h1>
      <form action="php/user_register.php" method="POST">
        <input type="text" name="full_name" id="fullName" placeholder="Full Name" required>
        <input type="email" name="email" id="registerEmail" placeholder="Email" required>
        <div class="password-container">
          <input type="password" id="registerPassword" name="password" placeholder="Password" required>
          <button type="button" id="toggle-register-password" class="toggle-password">👁️</button>
        </div>
        <input type="password" id="confirmPassword" name="confirm_password" placeholder="Confirm Password" required>
        <select name="role" id="role" required>
          <option value="farmer">Farmer</option>
          <option value="seller">Seller</option>
        </select>
        <input type="text" name="contact_number" id="contactNumber" placeholder="Contact Number">
        <input type="text" name="address" id="address" placeholder="Address">
        <button type="submit" class="btn-primary" id="registerBtn">Register</button>
      </form>
      <p>Already have an account? <a href="login.html">Login here</a></p>
    </div>
  </section>

  <!-- 🌾 Footer -->
  <footer>
    <p>© 2025 KabawBaka | Innovative • Sustainable • Agripreneurial</p>
    <p>
      <a href="#">Facebook</a> |
      <a href="#">Instagram</a> |
      <a href="#">Contact Us</a>
    </p>
  </footer>

</body>
</html>
