<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | KabawBaka?</title>
  <link rel="stylesheet" href="style.css">
  <script src="js/main.js"></script>
</head>
<body>

<script>
document.addEventListener('DOMContentLoaded', function() {
  // Check login status and update navbar
  fetch('php/check_session.php')
    .then(response => response.json())
    .then(data => {
      const userMenu = document.getElementById('userMenu');
      if (data.logged_in) {
        userMenu.innerHTML = `
          <a href="user_dashboard.html" class="btn-login">Dashboard</a>
          <a href="#" id="logoutBtn" class="btn-login">Logout</a>
        `;

        // Logout functionality
        document.getElementById('logoutBtn').addEventListener('click', function(e) {
          e.preventDefault();
          fetch('php/logout.php')
            .then(() => {
              window.location.reload();
            });
        });
      }
    });
});
</script>

  <!-- 🌾 Navbar -->
  <header>
    <div class="logo">
      <img src="assets/kabawbaka-logo.png" alt="KabawBaka Logo">
      <h2>KabawBaka?</h2>
    </div>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="marketplace.html">Marketplace</a></li>
        <li><a href="kabawbaka.html">KabawBaka?</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
    <div id="userMenu">
      <a href="login.html" class="btn-login">Login</a>
    </div>
  </header>

  <!-- 🌾 Login Section -->
  <section class="login-section">
    <div class="login-container">
      <h1>Login</h1>
      <form action="php/user_login.php" method="POST">
        <input type="email" name="email" id="loginEmail" placeholder="Email" required>
        <div class="password-container">
          <input type="password" id="loginPassword" name="password" placeholder="Password" required>
          <button type="button" id="toggle-login-password" class="toggle-password">👁️</button>
        </div>
        <button type="submit" class="btn-primary">Login</button>
      </form>
      <p>Don't have an account? <a href="register.html">Register here</a></p>
    </div>
  </section>

  <!-- 🌾 Footer -->
  <footer>
    <p>© 2025 KabawBaka | Innovative • Sustainable • Agripreneurial</p>
    <p>
      <a href="#">Facebook</a> |
      <a href="#">Instagram</a> |
      <a href="#">Contact Us</a>
    </p>
  </footer>

</body>
</html>
