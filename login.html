<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | KabawBaka?</title>
  <link rel="stylesheet" href="style.css">
  <script src="js/main.js"></script>
</head>
<body>
  <div id="navbar"></div>

  <script>
  document.addEventListener('DOMContentLoaded', function() {
    fetch('php/navbar.php')
      .then(response => response.text())
      .then(html => {
        document.getElementById('navbar').innerHTML = html;
        const logout = document.getElementById('logoutBtn');
        if (logout) {
          logout.addEventListener('click', function(e) {
            e.preventDefault();
            fetch('php/logout.php')
              .then(r => r.json())
              .then(data => { if (data.success) window.location.href = 'login.html'; })
              .catch(() => location.reload());
          });
        }
      });
  });
  </script>

  <!-- 🌾 Login Section -->
  <section class="login-section">
    <div class="login-container">
      <h1>Login</h1>
      <form action="php/user_login.php" method="POST">
        <input type="email" name="email" id="loginEmail" placeholder="Email" required>
        <div class="password-container">
          <input type="password" id="loginPassword" name="password" placeholder="Password" required>
          <button type="button" id="toggle-login-password" class="toggle-password">👁️</button>
        </div>
        <button type="submit" class="btn-primary">Login</button>
      </form>
      <p>Don't have an account? <a href="register.html">Register here</a></p>
    </div>
  </section>

  <!-- 🌾 Footer -->
  <footer>
    <p>© 2025 KabawBaka | Innovative • Sustainable • Agripreneurial</p>
    <p>
      <a href="#">Facebook</a> |
      <a href="#">Instagram</a> |
      <a href="#">Contact Us</a>
    </p>
  </footer>

</body>
</html>
